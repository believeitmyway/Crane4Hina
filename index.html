<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Physics Crane Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #202020; }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: white; display: flex; align-items: center; justify-content: center;
            z-index: 9999; font-family: sans-serif; font-size: 24px;
        }
        #debug-console {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: rgba(0,0,0,0.8); color: lime; overflow-y: scroll;
            z-index: 10000; pointer-events: none; font-family: monospace; font-size: 12px;
            padding: 10px; display: none; /* Hidden by default, toggled if needed or kept visible for debug version */
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        h1 { margin: 0; font-size: 24px; color: #ff66aa; }
        p { margin: 5px 0; font-size: 16px; }
        .controls {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }
        .key {
            display: inline-block;
            background: #444;
            border: 1px solid #777;
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: bold;
            color: #fff;
        }
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: none; /* Let clicks pass through gaps */
        }
        .control-btn {
            pointer-events: auto;
            width: 120px;
            height: 120px;
            background: rgba(255, 105, 180, 0.8); /* Hot pink */
            border: 4px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none; /* Prevent scroll */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.1s;
        }
        .control-btn:active {
            transform: scale(0.95);
            background: rgba(255, 105, 180, 1.0);
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>PHYSICS CATCHER PRO</h1>
        <p>High-Fidelity Physics Simulation</p>
        <div class="controls">
            <p>1. Hold <span class="key">Right Arrow</span> to move Right (X-axis)</p>
            <p>2. Hold <span class="key">Up Arrow</span> to move Back (Z-axis)</p>
            <p>3. Watch the auto-sequence!</p>
            <p><em>Tip: Nudge the center of gravity.</em></p>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="btn-right" class="control-btn">1. RIGHT</div>
        <div id="btn-back" class="control-btn">2. BACK</div>
    </div>

    <div id="loading-overlay">Loading Physics Engine...</div>
    <div id="debug-console"></div>

    <script>
        // Debug Console Setup
        const debugConsole = document.getElementById('debug-console');
        // Force display for debugging this issue
        debugConsole.style.display = 'block';

        function logToScreen(msg, type = 'log') {
            const div = document.createElement('div');
            div.textContent = `[${type.toUpperCase()}] ${msg}`;
            if (type === 'error') div.style.color = 'red';
            if (type === 'warn') div.style.color = 'yellow';
            debugConsole.appendChild(div);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            logToScreen(args.join(' '), 'log');
        };

        const originalWarn = console.warn;
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            logToScreen(args.join(' '), 'warn');
        };

        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            logToScreen(args.join(' '), 'error');
        };

        window.onerror = function(message, source, lineno, colno, error) {
            logToScreen(`${message} at ${source}:${lineno}:${colno}`, 'error');
        };
    </script>

    <!-- Import Map for Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <!-- Main Game Script -->
    <script type="module" src="./game.js"></script>
</body>
</html>
