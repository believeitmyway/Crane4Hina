<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Physics Crane Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #202020; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        h1 { margin: 0; font-size: 24px; color: #ff66aa; }
        p { margin: 5px 0; font-size: 16px; }
        .controls {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }
        .key {
            display: inline-block;
            background: #444;
            border: 1px solid #777;
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>PHYSICS CATCHER PRO</h1>
        <p>High-Fidelity Physics Simulation</p>
        <div class="controls">
            <p>1. Hold <span class="key">Right Arrow</span> to move Right (X-axis)</p>
            <p>2. Hold <span class="key">Up Arrow</span> to move Back (Z-axis)</p>
            <p>3. Watch the auto-sequence!</p>
            <p><em>Tip: Nudge the center of gravity.</em></p>
        </div>
    </div>

    <!-- Import Map for Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <!-- Main Game Script -->
    <script type="module" src="./game.js"></script>
</body>
</html>
